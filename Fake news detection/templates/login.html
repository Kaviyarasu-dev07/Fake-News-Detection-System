<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FNDS AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        .login-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 3rem 2rem;
            text-align: center;
        }
        .login-logo {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(59, 130, 246, 0.1);
            width: 100px; height: 100px;
            border-radius: 50%;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body>
    <div class="login-layout">
        <div class="card login-card animate-pop">
            <div class="login-logo">🔍</div>
            <h2 style="margin-bottom: 0.5rem; color: var(--text-primary); font-size: 2rem;">FNDS AI</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1rem;">Sign in to access Fact Checker Platform</p>

            {% if error %}
            <div class="card error-card animate-pop" style="margin-bottom: 1.5rem; padding: 1rem;">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="input-wrapper" style="text-align: left; margin-bottom: 1.25rem;">
                    <label style="font-size: 0.95rem; color: var(--text-secondary);">Administrator Username</label>
                    <input type="text" name="username" class="text-input" placeholder="username" required>
                </div>
                <div class="input-wrapper" style="text-align: left; margin-bottom: 2rem;">
                    <label style="font-size: 0.95rem; color: var(--text-secondary);">Secure Password</label>
                    <input type="password" name="password" class="text-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="font-size: 1.1rem; padding: 1rem;">Secure Login</button>
            </form>
        </div>
    </div>
</body>
</html>
